name: Build & Deploy to Shared Hosting via FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: Build Assets and FTP Deploy
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, curl, zip
          coverage: none

      - name: 📦 Install Composer Dependencies (Production)
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🎨 Install NPM & Build Vite Assets
        run: |
          npm install
          npm run build

      - name: 🚀 Deploy Files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR || 'public_html/' }}
          protocol: ftp
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/tests/**
            **/.github/**
            phpunit.xml
            README.md
            AGENTS.md
            .editorconfig
            .env
            .env.*
            public/storage/**
            public/storage*
            storage/app/public/**
            storage/app/public*
            storage/framework/cache/**
            storage/framework/sessions/**
            storage/framework/views/**
            storage/logs/**
